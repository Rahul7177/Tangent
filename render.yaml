services:
  - type: web
    name: tangent-relay
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: node server/realtime-server.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tangent-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: tangent-db
    databaseName: tangent
    user: tangent
